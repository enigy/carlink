name: Gate

# The same gate run locally before every commit: build the display app and the USB bridge, ktlint,
# detekt against the baseline, the unit tests, and the OCBM protocol-constant check. No signing, no
# artifacts, no uploads — a sideload/Release workflow comes later. Runs on every push and PR.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Mirrors the local layout (build root outside the source tree).
      BUILD_ROOT: ${{ github.workspace }}/build-out
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Bootstraps Gradle; gradle-daemon-jvm.properties then provisions the daemon JVM (JetBrains 21).
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The runner image's SDK can lag behind compileSdk 37.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-36" "build-tools;37.0.0" > /dev/null

      # OCBM constants: the Kotlin client is a hand copy of OCBM's Rust table (proto/README.md).
      # Cheap and first, so a wire-level mismatch is the top line of a failed run.
      - name: Check OCBM protocol constants
        run: python3 tools/proto_check.py

      # On failure, Gradle's "What went wrong" goes into a run annotation: readable on the run page
      # without opening the log.
      - name: Build, lint, detekt, test
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/gradle.log"
          if ! ./gradlew :app:assembleDebug :bridge:assembleDebug :app:ktlintCheck :app:detekt :app:testSideloadDebugUnitTest \
              -Pcarlink.buildRoot="$BUILD_ROOT" 2>&1 | tee "$log"; then
            msg=$( { grep '^e: ' "$log"; sed -n '/What went wrong:/,/^\* Try:/p' "$log" | grep -v '^\* Try:'; } | head -40)
            [ -n "$msg" ] || msg=$(tail -40 "$log")
            msg=${msg//'%'/'%25'}
            msg=${msg//$'\r'/'%0D'}
            msg=${msg//$'\n'/'%0A'}
            echo "::error title=Gate failed::$msg"
            exit 1
          fi

      - name: Test report
        if: always()
        run: |
          find "$BUILD_ROOT" -path '*test-results*' -name '*.xml' -print0 2>/dev/null \
            | xargs -0 grep -h '<testsuite ' 2>/dev/null \
            | grep -o 'tests="[0-9]*"\|failures="[0-9]*"\|errors="[0-9]*"' \
            | awk -F'"' '{a[$1]+=$2} END{for (k in a) print k a[k]}' || true
